<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Courier New', monospace;
    background:#000;
    color:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container {
    width:90%;
    max-width:600px;
    text-align:center;
}

.text {
    font-size:20px;
    line-height:1.7;
    min-height:120px;
    margin-bottom:30px;
    transition:0.3s;
}

.options {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
}

.option {
    padding:10px 16px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
}

.option:hover {
    background:rgba(255,255,255,0.15);
}

textarea {
    width:100%;
    margin-top:20px;
    padding:10px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    display:none;
}

/* WRITE BUTTON */
.write-toggle {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    border:1px solid #444;
    border-radius:50%;
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
}
</style>
</head>

<body>

<div class="container">
    <div id="text" class="text"></div>
    <div id="options" class="options"></div>
    <textarea id="input" placeholder="Write what you’re holding back..."></textarea>
</div>

<div class="write-toggle" onclick="toggleWrite()">✍️</div>

<script>
let step=0;
let state={};

function pause(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function typeText(text){
    let el=document.getElementById("text");
    el.innerHTML="";
    for(let i=0;i<text.length;i++){
        el.innerHTML+=text[i];
        await pause(20); // slower, readable
    }
}

function showOptions(arr,key){
    let opt=document.getElementById("options");
    opt.innerHTML="";
    arr.forEach(v=>{
        let d=document.createElement("div");
        d.className="option";
        d.innerText=v;
        d.onclick=()=>{
            state[key]=v;
            next();
        };
        opt.appendChild(d);
    });
}

function toggleWrite(){
    let input=document.getElementById("input");
    input.style.display = input.style.display==="none" ? "block" : "none";
}

// FLOW
async function next(){

if(step===0){
    await typeText("You’re not here by accident.");
    await pause(800);
    await typeText("Something brought you here.");
    showOptions(["Discipline","Overthinking","Relationship","Direction"],"area");
    step++;
    return;
}

if(step===1){
    await typeText("What did you avoid?");
    showOptions(["Decision","Conversation","Action","Truth"],"avoid");
    step++;
    return;
}

if(step===2){
    await typeText("Why?");
    showOptions(["Fear","Comfort","Uncertainty","Rejection"],"why");
    step++;
    return;
}

// PROCESS
document.getElementById("options").innerHTML="";

await typeText(`You avoided ${state.avoid}.\n\nBecause of ${state.why}.`);
await pause(1000);

await typeText("This isn’t new.");
await pause(1200);

await typeText("When it matters...\nyou step back.");
await pause(1400);

await typeText("If nothing changes...\nthis becomes you.");
await pause(1500);

await typeText("You already know what needs to happen.");
await pause(1200);

// DECISION
showOptions(["Act","Ignore"],"decision");

document.querySelectorAll(".option").forEach(btn=>{
    btn.onclick = async ()=>{
        document.getElementById("options").innerHTML="";

        if(btn.innerText==="Act"){
            await typeText("Then do it.\n\nBefore your mind softens this moment.");
        } else {
            await typeText("Then this repeats.\n\nExactly like before.");
        }

        await pause(1500);

        await typeText("This moment will come back.\n\nWill you be different when it does?");
        
        await pause(1500);

        // FINAL OPTIONS
        showOptions(["Face it again","Go deeper"],"final");

        document.querySelectorAll(".option").forEach(f=>{
            f.onclick=()=>{
                if(f.innerText==="Face it again"){
                    location.reload();
                } else {
                    toggleWrite();
                }
            };
        });
    };
});
}

// start
next();
</script>

</body>
</html>
