<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Courier New', monospace;
    background:#000;
    color:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container {
    width:90%;
    max-width:600px;
    text-align:center;
    transition:0.3s;
}

.text {
    font-size:18px;
    line-height:1.6;
    min-height:120px;
    margin-bottom:20px;
    transition:opacity 0.3s;
}

.options {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.option {
    padding:10px 14px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    cursor:pointer;
    opacity:0;
    animation:fadeIn 0.5s forwards;
}

@keyframes fadeIn {
    to {opacity:1;}
}

.option:hover {
    background:rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<div class="container">
    <div id="text" class="text"></div>
    <div id="options" class="options"></div>
</div>

<script>
let state={};
let step=0;

// MEMORY
let data=JSON.parse(localStorage.getItem("mirrorV7"))||{
sessions:0
};

function pause(ms){
return new Promise(res=>setTimeout(res,ms));
}

async function typeText(t){
let el=text;
el.innerHTML="";
for(let i=0;i<t.length;i++){
el.innerHTML+=t[i];
await pause(15);
}
}

function showOptions(arr,key){
options.innerHTML="";
arr.forEach(v=>{
let d=document.createElement("div");
d.className="option";
d.innerText=v;
d.onclick=()=>{
state[key]=v;
next();
};
options.appendChild(d);
});
}

async function next(){

if(step===0){
await typeText("This shows you what you avoid.");
await pause(800);

if(data.sessions>0){
await typeText("You've been here before.");
await pause(800);
}

showOptions(["Discipline","Overthinking","Relationship","Money"],"area");
step++;
return;
}

if(step===1){
await typeText("What did you avoid?");
showOptions(["Decision","Conversation","Action","Truth"],"avoid");
step++;
return;
}

if(step===2){
await typeText("Why?");
showOptions(["Fear","Comfort","Uncertainty","Rejection"],"why");
step++;
return;
}

// PROCESS
options.innerHTML="";
data.sessions++;
localStorage.setItem("mirrorV7",JSON.stringify(data));

await typeText(`
You avoided ${state.avoid}.

Because of ${state.why}.

This is not new.
`);

await pause(1200);

await typeText(`
When it matters...

you step back.
`);

await pause(1500);

await typeText(`
If nothing changes...

this becomes you.
`);

await pause(1500);

// FINAL
showOptions(["Act","Ignore"],"decision");

options.onclick=null;

options.querySelectorAll(".option").forEach(btn=>{
btn.onclick=async ()=>{
options.innerHTML="";

if(btn.innerText==="Act"){
await typeText("Then change it now.\n\nDon’t come back the same.");
}else{
await typeText(`
Then this repeats.

Exactly like before.

And next time...

it will feel even more normal.
`);
}

await pause(1500);

await typeText(`
This moment will come back.

Will you be different when it does?
`);
};
});
}

// start
next();
</script>

</body>
</html>
