<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: 'Courier New', monospace;
    background: radial-gradient(circle at center, #0d0d0d, #000);
    color:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* CONTAINER */
.container {
    width:100%;
    max-width:680px;
    padding:25px;
    border-radius:18px;
    backdrop-filter: blur(14px);
    background: rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.06);
}

/* TEXT */
.text {
    font-size:17px;
    line-height:1.7;
    min-height:120px;
    white-space:pre-line;
}

/* INPUT */
textarea {
    width:100%;
    box-sizing:border-box;
    margin-top:20px;
    padding:12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.7);
    color:#fff;
    font-family:'Courier New', monospace;
    resize:none;
}

/* BUTTON */
button {
    cursor:pointer;
    margin-top:15px;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.2);
    background:transparent;
    color:white;
}

button:hover {
    background: rgba(255,255,255,0.08);
}

/* POPUP */
.popup {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-content {
    max-width:400px;
    text-align:center;
    padding:25px;
    border-radius:12px;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body>

<!-- POPUP -->
<div id="popup" class="popup">
    <div class="popup-content">
        <h3>Mirror</h3>
        <p>This won’t motivate you.<br><br>
        It shows what you already know<br>
        but keep avoiding.<br><br>
        Answer honestly.<br>
        Or it won’t work.</p>
        <button onclick="start()">Enter</button>
    </div>
</div>

<div class="container">
    <div id="text" class="text"></div>
    <textarea id="input" rows="3" placeholder="Type honestly..."></textarea>
    <button id="btn" onclick="next()">Continue</button>
</div>

<script>
let step=0;
let answers=[];
let mode="questions";

// STORAGE
let data=JSON.parse(localStorage.getItem("mirrorV4"))||{
sessions:0,
patterns:{},
identity:""
};

// QUESTIONS
const questions=[
"Who are you trying to become right now?",
"What are you dealing with?",
"What did you know… but didn’t act on?",
"What did you avoid?",
"What are you not admitting?"
];

// START
function start(){
document.getElementById("popup").style.display="none";
typeText("This will show you what you keep avoiding.\n\nAnswer honestly.");
}

// TYPE EFFECT
function typeText(text,cb){
let i=0;
let el=document.getElementById("text");
el.innerHTML="";
let int=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length){
clearInterval(int);
if(cb)setTimeout(cb,700);
}
},18);
}

// NEXT
function next(){
let input=document.getElementById("input");
let val=input.value.trim().toLowerCase();

if(mode==="release"){
typeText("You said it.\n\nNow don’t go back to silence.");
input.style.display="none";
btn.style.display="none";
return;
}

if(val.length<3){
typeText("Still avoiding. Try again.");
return;
}

answers.push(val);

if(step===0){
data.identity=val;
}

input.value="";
step++;

if(step<questions.length){
typeText(questions[step]);
}else{
process();
}
}

// PATTERN
function detectPattern(){
let text=answers.join(" ");
if(text.match(/avoid|delay|later/)) return "avoid";
if(text.match(/change|accept|people/)) return "approval";
if(text.match(/lazy|easy/)) return "comfort";
if(text.match(/think|overthink/)) return "think";
return "default";
}

// PROCESS
function process(){
let pattern=detectPattern();

data.sessions++;
data.patterns[pattern]=(data.patterns[pattern]||0)+1;

localStorage.setItem("mirrorV4",JSON.stringify(data));

input.style.display="none";
btn.style.display="none";

let count=data.patterns[pattern];
let identity=data.identity;

let output="";

// CONTRADICTION ENGINE
output+=`You said you want to be: ${identity}\n\n`;

if(pattern==="avoid"){
output+=`But you avoided what mattered.\n\n`;
}
if(pattern==="approval"){
output+=`But you changed yourself to be accepted.\n\n`;
}
if(pattern==="comfort"){
output+=`But you chose comfort over effort.\n\n`;
}
if(pattern==="think"){
output+=`But you stayed in your head instead of moving.\n\n`;
}

// ESCALATION
if(count>=3){
output+=`This is the ${count}rd time you're seeing this.\n\n`;
}

// CORE HIT
output+=`This isn’t confusion.\nIt’s contradiction.\n\n`;

// FUTURE PROJECTION
output+=`If nothing changes:\n\nThis won’t stay a phase.\nIt becomes who you are.\n\n`;

// REALIZATION
output+=`You already know what needs to be done.\n\n`;

// ACTION
output+=`Now:\nAct on it before you think again.\n\n`;

// REFLECTION
output+=`If this shows up again tomorrow...\nwill you still choose the same?`;

typeText(output,startRelease);
}

// RELEASE
function startRelease(){
mode="release";
input.style.display="block";
btn.style.display="block";
input.placeholder="Say what you didn’t say...";
input.value="";
}

// INIT TEXT (before popup)
document.getElementById("text").innerText="";
</script>

</body>
</html>
